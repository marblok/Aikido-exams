    <style>
        .tooltip {
          position: relative;
          cursor: help;
        }
    
        .tooltip .tooltip-text {
          visibility: hidden;
          width: max-content;
          background-color: #333;
          color: #fff;
          text-align: left;
          padding: 8px;
          border-radius: 6px;
          position: absolute;
          z-index: 1;
          bottom: 125%; /* Position above the text */
          left: 50%;
          transform: translateX(-50%);
          opacity: 0;
          transition: opacity 0.3s;
          white-space: nowrap;
        }
    
        .tooltip:hover .tooltip-text {
          visibility: visible;
          opacity: 1;
        }
    
        .tooltip-text b {
          font-weight: bold;
          color: #ffcc00;
        }
      </style>
</head>
