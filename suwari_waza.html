<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suwari Waza - Aikido Table</title>
    <link rel="stylesheet" href="components/style.css"><!-- optional, or use inline CSS -->
    <style>
      body {
        background: url("images/Aikido backgroud - tall.png") no-repeat center center;
        background-size: cover;
        background-attachment: scroll;
      }
    </style>
</head>
<body>
<div class="container">
    <h1 id="pageTitle">Suwari Waza (Seated Techniques)</h1>
    <div id="mainContainer"></div>    

</div>

<script type="module">
import {suwariWazaTechniquesTable, suwariWazaExaminationTechniquesTable} from './components/suwariWazaTechniques.js';
import {AikidoTableManager} from './components/aikidoTableApp.js';

document.addEventListener('DOMContentLoaded', () => {
    new AikidoTableManager({
        techniquesTable: suwariWazaTechniquesTable,
        examinationTechniquesTable: suwariWazaExaminationTechniquesTable,
        tableHtmlUrl: 'components/mainTechniquesTable.html',
        pageTitle: "Suwari Waza (Seated Techniques)",
        attackListTitle: "Videos",
        noteHtml: `<p style="margin-top: 20px; font-size: 14px; color: #7f8c8d;">
            <strong>Note:</strong> This reference is based on requirements from 
            <a href="https://centrum-aikido.org.pl" target="_blank">Centrum Aikido Aikikai Polska</a> 
            but may not be complete or up-to-date.
        </p>
        <p class="image-credit">Background images generated using Microsoft Copilot.</p>`
    });
});
</script>
</body>
</html>
